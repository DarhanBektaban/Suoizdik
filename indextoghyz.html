    function getRosenbergWave(ctx) {
      const n = 2048;
      const real = new Float32Array(n);
      const imag = new Float32Array(n);
      for (let k = 1; k < n; k++) {
        const harm = 1 / Math.pow(k, 1.4);
        real[k] = (k % 2 === 0 ? 1 : -1) * harm * 0.5;
        imag[k] = harm * Math.sin(k * 0.4);
      }
      return ctx.createPeriodicWave(real, imag, { disableNormalization: false });
    }

    let noiseBuffer = null;
    function getNoise(ctx) {
      if (!noiseBuffer) {
        const len = ctx.sampleRate * 1.5;
        noiseBuffer = ctx.createBuffer(1, len, ctx.sampleRate);
        const out = noiseBuffer.getChannelData(0);
        for (let i = 0; i < len; i++) {
          out[i] = Math.random() * 2 - 1;
        }
      }
      return noiseBuffer;
    }

    function synthesizeAcousticWord(word) {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const tokens = [];
      let i = 0;
      const w = word.toLowerCase();
      while (i < w.length) {
        if (i + 3 <= w.length && acousticMap[w.slice(i, i + 3)]) {
          tokens.push(w.slice(i, i + 3));
          i += 3;
        } else if (i + 2 <= w.length && acousticMap[w.slice(i, i + 2)]) {
          tokens.push(w.slice(i, i + 2));
        } else {
          tokens.push(w[i]);
          i += 1;
        }
      }

      const totalDur = tokens.reduce((acc, t) => acc + (acousticMap[t]?.dur || 0.12), 0);
      const rosenbergWave = getRosenbergWave(audioCtx);
      const now = audioCtx.currentTime + 0.05;

      const voiceOsc = audioCtx.createOscillator();
      voiceOsc.setPeriodicWave(rosenbergWave);

      const basePitch = 120;
      voiceOsc.frequency.setValueAtTime(basePitch * 0.95, now);
      voiceOsc.frequency.exponentialRampToValueAtTime(basePitch * 1.08, now + totalDur * 0.25);
      voiceOsc.frequency.exponentialRampToValueAtTime(basePitch * 0.88, now + totalDur);

      const vibrato = audioCtx.createOscillator();
      vibrato.frequency.setValueAtTime(5.2, now);
      const vibratoGain = audioCtx.createGain();
      vibratoGain.gain.setValueAtTime(1.8, now);
      vibrato.connect(vibratoGain);
      vibratoGain.connect(voiceOsc.frequency);
      vibrato.start(now);
      vibrato.stop(now + totalDur + 0.05);

      const voiceGain = audioCtx.createGain();
      voiceGain.gain.setValueAtTime(0, now);

      const formants = [
        { filter: audioCtx.createBiquadFilter(), q: 5.5 },
        { filter: audioCtx.createBiquadFilter(), q: 7.5 },
        { filter: audioCtx.createBiquadFilter(), q: 10.0 },
        { filter: audioCtx.createBiquadFilter(), q: 12.0 }
      ];

      const masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(0.85, now);
      masterGain.connect(audioCtx.destination);

      formants.forEach((f) => {
        f.filter.type = 'bandpass';
        f.filter.Q.setValueAtTime(f.q, now);
        voiceGain.connect(f.filter);
        f.filter.connect(masterGain);
      });

      voiceOsc.connect(voiceGain);
      voiceOsc.start(now);
      voiceOsc.stop(now + totalDur + 0.05);

      const noiseSource = audioCtx.createBufferSource();
      noiseSource.buffer = getNoise(audioCtx);
      const noiseFilter = audioCtx.createBiquadFilter();
      noiseFilter.type = 'bandpass';
      noiseFilter.Q.setValueAtTime(3.0, now);
      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0, now);

      noiseSource.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(masterGain);

      noiseSource.start(now);
      noiseSource.stop(now + totalDur + 0.05);

      let tCursor = now;

      tokens.forEach((token) => {
        const p = acousticMap[token] || acousticMap['a'];
        const dur = p.dur;
        const ramp = dur * 0.35;

        if (p.type === 'fricative') {
          voiceGain.gain.linearRampToValueAtTime(0.005, tCursor + 0.02);
          noiseFilter.frequency.setValueAtTime(p.noiseF, tCursor);
          noiseGain.gain.setValueAtTime(0.001, tCursor);
          noiseGain.gain.linearRampToValueAtTime(p.amp * 0.22, tCursor + 0.03);
          noiseGain.gain.setValueAtTime(p.amp * 0.22, tCursor + dur - 0.03);
          noiseGain.gain.linearRampToValueAtTime(0.001, tCursor + dur);
        } else if (p.type === 'unvoiced_stop') {
          voiceGain.gain.linearRampToValueAtTime(0.001, tCursor);
          noiseFilter.frequency.setValueAtTime(p.f2 || 2000, tCursor);
          noiseGain.gain.setValueAtTime(0.4, tCursor);
          noiseGain.gain.linearRampToValueAtTime(0.001, tCursor + 0.015);
        } else {
          noiseGain.gain.linearRampToValueAtTime(0.001, tCursor + 0.01);
          voiceGain.gain.linearRampToValueAtTime(p.amp * 0.28, tCursor + ramp);

          formants[0].filter.frequency.exponentialRampToValueAtTime(p.f1, tCursor + ramp);
          formants[1].filter.frequency.exponentialRampToValueAtTime(p.f2, tCursor + ramp);
          formants[2].filter.frequency.exponentialRampToValueAtTime(p.f3 || 2500, tCursor + ramp);
          formants[3].filter.frequency.setValueAtTime(3500, tCursor);
        }

        tCursor += dur;
      });

      voiceGain.gain.linearRampToValueAtTime(0.0001, tCursor);
    }
