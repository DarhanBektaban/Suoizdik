  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 36px 28px;
      border-radius: 20px;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.06);
      width: 100%;
      max-width: 480px;
      text-align: center;
      border: 1px solid #e2e8f0;
    }
    h1 {
      font-size: 2.2rem;
      color: #1e3a8a;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }
    p.subtitle {
      color: #64748b;
      margin-bottom: 24px;
      font-size: 0.95rem;
    }
    input[type="text"] {
      width: 100%;
      padding: 16px 20px;
      font-size: 1.2rem;
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      outline: none;
      transition: all 0.2s ease;
      text-align: center;
    }
    input[type="text"]:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .result-box {
      margin-top: 24px;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .match-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: #f0fdf4;
      padding: 18px 24px;
      border-radius: 14px;
      border: 1.5px solid #86efac;
    }
    .word-text {
      font-size: 1.5rem;
      font-weight: 700;
      color: #166534;
      letter-spacing: 0.3px;
    }
    .audio-btn {
      background: #16a34a;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .audio-btn:hover {
      background: #15803d;
    }
    .empty-state {
      color: #94a3b8;
      font-size: 0.95rem;
    }
  </style>
</head>

        // Қазақ тілінде таза оқу функциясы
    function speakWord(bektabanWord) {
      if (!('speechSynthesis' in window)) {
        alert("Barlauushy dybystaudy qoldamajdy.");
        return;
      }

      window.speechSynthesis.cancel();

      // Бектабан жазуын қазақша кириллге аудару
      const qazaqText = toSpeech(bektabanWord);
      const utterance = new SpeechSynthesisUtterance(qazaqText);

      // Барлық қолжетімді дауыстарды алу
      const voices = window.speechSynthesis.getVoices();

      // Тек қазақ тілін (kk, kk-KZ) іздеу
      const kazakhVoice = voices.find(v => 
        v.lang === 'kk-KZ' || 
        v.lang === 'kk_KZ' || 
        v.lang.toLowerCase().startsWith('kk')
      );

      if (kazakhVoice) {
        utterance.voice = kazakhVoice;
        utterance.lang = kazakhVoice.lang;
      } else {
        utterance.lang = 'kk-KZ';
      }

      // Қазақша анық шығуы үшін екпін мен жылдамдықты баптау
      utterance.rate = 0.85; 
      utterance.pitch = 1.0;

      window.speechSynthesis.speak(utterance);
    }

    wordInput.addEventListener('input', (e) => {
      const query = e.target.value.trim().toLowerCase();

      if (!query) {
        resultBox.innerHTML = '<span class="empty-state">Suoizdi engizigniz...</span>';
        return;
      }

      // Тек дәл сәйкес келетін сөзді табу
      const exactMatch = wordList.find(word => word === query);

      if (exactMatch) {
        resultBox.innerHTML = `
          <div class="match-card">
            <span class="word-text">${exactMatch}</span>
            <button class="audio-btn" onclick="speakWord('${exactMatch}')">
              🔊 Tygnjauu
            </button>
          </div>
        `;
      } else {
        resultBox.innerHTML = '<span class="empty-state">Bunday suoiz qorda zhoq nemese tolyq zhazylmady</span>';
      }
    });
